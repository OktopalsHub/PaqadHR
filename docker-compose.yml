# Local development database only. API and web run on the host (pnpm dev).
# Usage: pnpm infra:up  /  pnpm infra:logs  /  pnpm infra:down
# Host port defaults to 5433 so it never clashes with another Postgres on 5432.
# Override with POSTGRES_PORT=5432 pnpm infra:up
services:
  db:
    image: postgres:18-alpine
    container_name: paqadhr-postgres-dev
    restart: unless-stopped
    # Loopback only: never publish the dev database beyond this machine.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paqadhr
    volumes:
      - paqadhr-pg18-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d paqadhr']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Disposable Postgres 18 for migration and integration tests (no persistent volume).
  # Usage: docker compose --profile test up -d db-test
  #   DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5544/paqadhr_test
  db-test:
    image: postgres:18-alpine
    container_name: paqadhr-postgres-test
    profiles: ['test']
    ports:
      - '127.0.0.1:5544:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paqadhr_test
    # PG 18 images keep data under /var/lib/postgresql; tmpfs makes every run start clean.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d paqadhr_test']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  paqadhr-pg18-data:
    # Named volume survives `docker compose down` (use `down -v` to wipe).
    name: paqadhr-pg18-data
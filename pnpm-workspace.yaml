packages:
  - "apps/*"

allowBuilds:
  # Scarf only sends package-install telemetry; no application functionality
  # depends on it.
  '@scarf/scarf': false
  # These packages provide the native tooling used by the API and web builds.
  '@swc/core': true
  argon2: true
  esbuild: true
  unrs-resolver: true
  workerd: true

onlyBuiltDependencies:
  - argon2

overrides:
  browserslist: ">=4.28.7"
  flatted: ">=3.4.2"
  tar: ">=7.5.16"
  postcss: ">=8.5.18"
  picomatch: ">=4.0.4"
  js-yaml: ">=4.3.1 <5"
  nanoid@<3.3.17: ">=3.3.17 <4"
  axios: ">=1.18.0 <2"
  form-data: ">=4.0.6 <5"
  undici: ">=7.29.0 <8"
  ws: ">=8.21.0 <9"
  multer: ">=2.2.0 <3"
  piscina: ">=4.9.3 <5"
  body-parser: ">=2.3.0 <3"
  brace-expansion@1: ">=1.1.17 <2"
  brace-expansion@2: ">=2.1.3 <3"
  brace-expansion@4: ">=5.0.8 <6"
  brace-expansion@5: ">=5.0.8 <6"
  cookie@<0.7.0: ">=0.7.0 <1"
  esbuild@>=0.27.0 <0.28.1: ">=0.28.1 <0.29.0"
  fast-uri: ">=3.1.4"
  ip-address: ">=10.3.1 <11"
  sharp: ">=0.35.0"
  browserslist: ">=4.28.7"

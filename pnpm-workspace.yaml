packages:
  - "apps/*"

allowBuilds:
  # Scarf only sends package-install telemetry; no application functionality
  # depends on it.
  '@scarf/scarf': false
  # These packages provide the native tooling used by the API and web builds.
  '@swc/core': true
  argon2: true
  esbuild: true
  unrs-resolver: true
  workerd: true
auditConfig:
  ignoreCves:
    - GHSA-vfj7-8cjw-p6xm

onlyBuiltDependencies:
  - argon2

overrides:
  "@xhmikosr/decompress": ">=11.1.4 <12"
  axios: ">=1.20.0 <2"
  baseline-browser-mapping: ">=2.11.0 <3"
  body-parser: ">=2.3.0 <3"
  brace-expansion@1: ">=1.1.21 <2"
  brace-expansion@2: ">=2.1.7 <3"
  brace-expansion@4: ">=5.0.12 <6"
  brace-expansion@5: ">=5.0.12 <6"
  browserslist: ">=4.28.7"
  cookie@<0.7.0: ">=0.7.0 <1"
  dompurify: ">=3.4.16 <4"
  esbuild@>=0.27.0 <0.28.1: ">=0.28.1 <0.29.0"
  fast-uri: ">=4.1.5"
  "fflate@>=0.6.0 <0.6.11": ">=0.6.11 <0.7"
  flatted: ">=3.4.2"
  form-data: ">=4.0.6 <5"
  handlebars: ">=4.7.10 <5"
  http-cache-semantics: ">=4.3.0 <5"
  ip-address: ">=10.7.1 <11"
  js-yaml: ">=4.3.2 <5"
  moment: ">=2.31.0 <3"
  multer: ">=2.4.0 <3"
  nanoid@<3.3.17: ">=3.3.17 <4"
  picomatch: ">=4.0.4"
  piscina: ">=4.9.4 <5"
  postcss: ">=8.5.18"
  # Raised for the Dependabot batch of 2026-10-09 (alerts #68-#143).
  proxy-addr: ">=2.0.8 <3"
  qs: ">=6.16.0 <7"
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
  tar: ">=7.5.16"
  undici: ">=7.29.1 <8"
  ws: ">=8.21.0 <9"

# No fixed braces release exists (Dependabot #133, CVE-2026-93687 / GHSA-vfj7-8cjw-p6xm,
# fixed in micromatch/braces#70). The patch adds the max-depth guard the upstream issue
# recommends, so the vulnerable AST walkers can no longer be driven into stack exhaustion.
# Drop this block once braces ships a release outside the "<= 3.0.3" range.
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch

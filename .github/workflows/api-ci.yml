name: API — Build and Publish

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter api lint

      - name: Test API
        run: pnpm --filter api test

      - name: Build API
        run: pnpm --filter api build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paqadhr
          TRUSTED_ORIGINS: http://localhost:3000
          ACCESS_SECRET: ci-access-secret-must-be-at-least-32-chars-long
          REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-chars-long
          ENCRYPTION_KEY: '01234567890123456789012345678901'
          NODE_ENV: development
          PORT: '9001'
          BASE_URL: http://localhost:9001
          FRONTEND_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          GOOGLE_CALLBACK_URL: http://localhost:9001/api/v1/auth/google/callback

  build-and-publish:
    if: github.event_name == 'push'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO }}-api
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
            curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
          else
            echo "DOKPLOY_WEBHOOK_URL not set — skipping deploy trigger"
          fi

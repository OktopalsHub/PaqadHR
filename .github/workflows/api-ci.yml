name: API — Build and Publish

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/api/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'biome.json'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/api/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'biome.json'
      - '.github/workflows/api-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paqadhr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Audit dependencies
      #   run: pnpm audit --audit-level=high

      - name: Lint API
        run: pnpm --filter api check

      - name: Check @Body() DTO imports
        run: pnpm --filter api check:body-dtos

      - name: Build API
        run: pnpm --filter api build

      - name: Check DTO module load (TDZ guard)
        run: pnpm --filter api check:dto-load

    #  - name: Run API tests
        #run: pnpm --filter api test
        #env:
         # DATABASE_URL: postgres://postgres:postgres@localhost:5432/paqadhr_test

  build-and-publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
          REPO_LC=${GITHUB_REPOSITORY,,}
          echo "REPO=${REPO_LC}" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${REPO_LC##*/}" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged GHCR manifests
        uses: actions/delete-package-versions@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5

      - name: Trigger Dokploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL not set — skipping deploy trigger"
            exit 0
          fi
          # Docker/GHCR apps need registry_package + matching tag (e.g. :dev).
          # Bare POST can return success while redeploying a cached local image.
          IMAGE="ghcr.io/${REPO}:${GITHUB_REF_NAME}"
          BODY=$(jq -nc \
            --arg url "$IMAGE" \
            --arg id "${GITHUB_SHA}" \
            --arg msg "CI deploy ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME})" \
            '{
              head_commit: {id: $id, message: $msg},
              registry_package: {package_version: {package_url: $url}}
            }')
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: registry_package" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          echo "Dokploy response ($CODE) for $IMAGE: $BODY_OUT"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            exit 22
          fi

name: Web — Check, Build and Publish

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'constants/**'
      - '.github/scripts/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'biome.json'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'constants/**'
      - '.github/scripts/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'biome.json'
      - '.github/workflows/web-ci.yml'

jobs:
  check-and-build:
    environment: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'production' || 'development' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

      - name: Check braces patch (CVE-2026-93687)
        run: pnpm check:patches

      - name: Lint web
        run: pnpm --filter web check

      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ vars.NEXT_PUBLIC_APP_DOMAIN }}
          NEXT_PUBLIC_USE_SUBDOMAIN_TENANTS: ${{ vars.NEXT_PUBLIC_USE_SUBDOMAIN_TENANTS }}
          NEXT_PUBLIC_APP_BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

  cf-build:
    environment: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'production' || 'development' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: OpenNext Cloudflare build
        run: pnpm --filter web cf:build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ vars.NEXT_PUBLIC_APP_DOMAIN }}
          NEXT_PUBLIC_USE_SUBDOMAIN_TENANTS: ${{ vars.NEXT_PUBLIC_USE_SUBDOMAIN_TENANTS }}
          NEXT_PUBLIC_APP_BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

      - name: Upload OpenNext build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennext-build
          path: apps/web/.open-next
          retention-days: 1

  cf-deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: cf-build
    environment: ${{ (github.ref_name == 'main') && 'production' || 'development' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download OpenNext build artifacts
        uses: actions/download-artifact@v4
        with:
          name: opennext-build
          path: apps/web/.open-next

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter web cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ github.ref_name == 'main' && 'paqadhr' || 'paqadhr-dev' }}
          CF_WORKERS_DEV: ${{ github.ref_name != 'main' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ vars.NEXT_PUBLIC_APP_DOMAIN }}
          NEXT_PUBLIC_USE_SUBDOMAIN_TENANTS: ${{ vars.NEXT_PUBLIC_USE_SUBDOMAIN_TENANTS }}

  build-and-publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: check-and-build
    environment: ${{ (github.ref_name == 'main') && 'production' || 'development' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
          REPO_LC=${GITHUB_REPOSITORY,,}
          echo "REPO=${REPO_LC}" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${REPO_LC##*/}-web" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO }}-web
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_DOMAIN=${{ vars.NEXT_PUBLIC_APP_DOMAIN }}
            NEXT_PUBLIC_USE_SUBDOMAIN_TENANTS=${{ vars.NEXT_PUBLIC_USE_SUBDOMAIN_TENANTS }}
            NEXT_PUBLIC_APP_BUILD_ID=${{ github.sha }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_R2_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged GHCR manifests
        uses: actions/delete-package-versions@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5

      - name: Trigger Dokploy webhook
        env:
          # Each Dokploy app has its own webhook URL, so dev and prod deploy
          # triggers are separate secrets. DOKPLOY_WEB_WEBHOOK_URL is kept as
          # the dev fallback for setups that only configured the dev app.
          # Both also require Auto Deploy enabled on the Dokploy application.
          DOKPLOY_WEB_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEB_WEBHOOK_URL }}
          DOKPLOY_WEB_WEBHOOK_URL_DEV: ${{ secrets.DOKPLOY_WEB_WEBHOOK_URL_DEV }}
          DOKPLOY_WEB_WEBHOOK_URL_PROD: ${{ secrets.DOKPLOY_WEB_WEBHOOK_URL_PROD }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            WEBHOOK="$DOKPLOY_WEB_WEBHOOK_URL_PROD"
            TARGET=prod
          else
            WEBHOOK="${DOKPLOY_WEB_WEBHOOK_URL_DEV:-$DOKPLOY_WEB_WEBHOOK_URL}"
            TARGET=dev
          fi
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEB_WEBHOOK_URL_${TARGET^^} not set — skipping $TARGET deploy trigger"
            exit 0
          fi
          # Dokploy expects a GitHub-style push payload (bare POST returns 400).
          BODY=$(jq -nc \
            --arg ref "refs/heads/${GITHUB_REF_NAME}" \
            --arg id "${GITHUB_SHA}" \
            --arg msg "CI deploy ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME})" \
            '{ref:$ref,head_commit:{id:$id,message:$msg}}')
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          echo "Dokploy response ($CODE): $BODY_OUT"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            exit 22
          fi
